name: Build Hejly Community Edition

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full 40-character source commit SHA to build, validate and publish'
        required: true
        type: string

permissions:
  contents: read

# Serialize publication of the same source tag; never cancel a publishing run.
concurrency:
  group: hejly-ce-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  build:
    name: Build and validate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Prepare CE build context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # Match publish_foss_docker.yml in this disposable CI checkout only.
          rm -rf enterprise spec/enterprise
          printf '\nENV CW_EDITION="ce"\n' >> docker/Dockerfile
          echo "HEJLY_IMAGE=hejly/chatwoot:sha-${SOURCE_SHA}-ce-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build locally without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.HEJLY_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/hejly/chatwoot
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          load: true
          push: false

      - name: Validate CE image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e EXPECTED_SHA="$SOURCE_SHA" --entrypoint sh "$HEJLY_IMAGE" -ec '
            test "$CW_EDITION" = ce
            test ! -e /app/enterprise
            test ! -e /app/spec/enterprise
            test "$(cat /app/.git_sha)" = "$EXPECTED_SHA"
            test -s /app/public/brand-assets/logo.svg
            test -s /app/public/brand-assets/logo_dark.svg
            test -s /app/public/brand-assets/logo_thumbnail.svg
            ruby -c /app/script/hejly/configure_branding.rb
          '
          docker run --rm --entrypoint ruby "$HEJLY_IMAGE" \
            -r /app/lib/chatwoot_app.rb -e 'abort "Enterprise is enabled" if ChatwootApp.enterprise?'

      - name: Export image for review
        shell: bash
        run: |
          set -euo pipefail
          docker save "$HEJLY_IMAGE" | gzip > "$RUNNER_TEMP/hejly-ce-${{ matrix.arch }}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hejly-ce-${{ inputs.source_sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/hejly-ce-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish validated multi-platform CE image
    needs: build
    if: github.repository == 'hejly/chatwoot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hejly/chatwoot
    steps:
      - name: Download validated amd64 image
        uses: actions/download-artifact@v4
        with:
          name: hejly-ce-${{ inputs.source_sha }}-amd64
          path: ${{ runner.temp }}/images

      - name: Download validated arm64 image
        uses: actions/download-artifact@v4
        with:
          name: hejly-ce-${{ inputs.source_sha }}-arm64
          path: ${{ runner.temp }}/images

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing source tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token=$(curl --fail --silent --show-error --get \
            --user "$GITHUB_ACTOR:$GH_TOKEN" \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode 'scope=repository:hejly/chatwoot:pull,push' \
            https://ghcr.io/token | jq -er '.token')
          echo "::add-mask::$token"
          status=$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/hejly/chatwoot/manifests/sha-${SOURCE_SHA}-ce")
          case "$status" in
            404) ;; # Only a missing tag permits publication.
            200) echo 'Source tag already exists; refusing to overwrite it.' >&2; exit 1 ;;
            *) echo "Cannot verify source tag (HTTP $status); refusing publication." >&2; exit 1 ;;
          esac

      - name: Publish the validated images and combined manifest
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/hejly-ce-${arch}.tar.gz"
            local_image="hejly/chatwoot:sha-${SOURCE_SHA}-ce-${arch}"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$local_image")" = "linux/$arch"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_image")" = "$SOURCE_SHA"
            # Unique transport tags allow retrying a partial publication without reusing them.
            transport_tag="$IMAGE:sha-${SOURCE_SHA}-ce-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
            docker tag "$local_image" "$transport_tag"
            docker push "$transport_tag"
            digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$transport_tag")
            [[ "$digest_ref" == "$IMAGE@sha256:"* ]]
            sources+=("$digest_ref")
            docker image rm "$local_image" "$transport_tag"
          done
          target="$IMAGE:sha-${SOURCE_SHA}-ce"
          docker buildx imagetools create --tag "$target" "${sources[@]}"
          docker buildx imagetools inspect --raw "$target" > "$RUNNER_TEMP/hejly-manifest.json"
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' \
            "$RUNNER_TEMP/hejly-manifest.json"
          digest=$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "Published: $target"
            echo "Source commit: $SOURCE_SHA"
            echo "Immutable deployment reference: $IMAGE@$digest"
          } >> "$GITHUB_STEP_SUMMARY"
